allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security patches for transitive deps (Dependabot GHSA alerts).
# Drop an entry once the parent package ships the patched version itself.
overrides:
  "@babel/core": "^7.29.6" # GHSA-4x5r-pxfx-6jf8
  # Scoped to the 3.x-4.x line only: minimatch@3 pulls brace-expansion@1.1.14,
  # which is outside the advisory range and breaks if forced to 5.x.
  "brace-expansion@>=3.0.0 <5.0.7": "^5.0.7" # GHSA-3jxr-9vmj-r5cp
  esbuild: "^0.28.1" # GHSA-g7r4-m6w7-qqqr
  js-yaml: "^4.2.0" # GHSA-h67p-54hq-rp68
  postcss: "^8.5.10" # GHSA-qx2v-qp2m-jg93
  sharp: "^0.35.0" # GHSA-f88m-g3jw-g9cj (next pins ^0.34.5; override until it bumps)

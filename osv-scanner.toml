reason = "picomatch@2.3.2 and picomatch@4.0.7 have no patched release as of 2026-11-18. GitHub advisory data reports no first patched version for the affected range <= 4.0.7, and npm view picomatch versions ends at 4.0.7. Reachability evidence: both versions are dev-only (pnpm why picomatch --prod is empty); 2.3.2 comes from @next/eslint-plugin-next via fast-glob and micromatch, 4.0.7 from typescript-eslint and knip via tinyglobby and fdir; app, components, hooks, lib and scripts import no glob library; the next build output has no picomatch in .next/static, and Next.js's vendored copy in next/dist/compiled/picomatch only matches images patterns from next.config. Re-evaluate before passing user-supplied glob patterns to any tool. Approved on 2026-11-18. Remove when a picomatch release outside the affected range is available."
